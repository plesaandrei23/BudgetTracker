<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Budget Pro Custom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hidden { display: none !important; }
        .modal-enter { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body class="pb-20 text-slate-800">

    <div id="loginScreen" class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center text-white p-6 hidden">
        <i class="fa-solid fa-cloud text-6xl text-blue-500 mb-6"></i>
        <h1 class="text-3xl font-bold mb-2">Budget Cloud</h1>
        <p class="text-slate-400 mb-8 text-center">Sincronizare & Categorii Custom</p>
        <button id="googleLoginBtn" class="bg-white text-slate-900 px-6 py-3 rounded-xl font-bold flex items-center gap-3 hover:bg-slate-100 transition">
            <i class="fa-brands fa-google text-red-500"></i> Autentificare cu Google
        </button>
    </div>

    <div id="appScreen" class="hidden">
        
        <div class="bg-slate-900 text-white p-6 rounded-b-[2rem] shadow-xl mb-6 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500 rounded-full mix-blend-overlay filter blur-3xl opacity-20"></div>
            
            <div class="flex justify-between items-center mb-6 relative z-10">
                <h1 class="text-xl font-bold">Budget Pro</h1>
                
                <div class="flex gap-3">
                    <button onclick="exportData()" class="bg-white/10 w-8 h-8 rounded-lg hover:bg-white/20 flex items-center justify-center backdrop-blur-sm transition" title="Backup">
                        <i class="fa-solid fa-cloud-arrow-down text-xs"></i>
                    </button>
                    <button onclick="toggleSettings()" class="bg-white/10 w-8 h-8 rounded-lg hover:bg-white/20 flex items-center justify-center backdrop-blur-sm transition" title="Setări">
                        <i class="fa-solid fa-gear text-xs"></i>
                    </button>
                </div>
            </div>

            <div class="flex justify-between items-end mb-6 relative z-10">
                <div>
                    <p class="text-slate-400 text-xs font-medium uppercase tracking-wider mb-1">Balanță</p>
                    <p class="text-3xl font-bold tracking-tight" id="balance">...</p>
                </div>
                <div class="text-right space-y-1">
                    <div class="flex items-center justify-end gap-2 text-emerald-400">
                        <i class="fa-solid fa-arrow-down text-xs"></i><span class="font-bold" id="totalIncome">0</span>
                    </div>
                    <div class="flex items-center justify-end gap-2 text-rose-400">
                        <i class="fa-solid fa-arrow-up text-xs"></i><span class="font-bold" id="totalExpense">0</span>
                    </div>
                </div>
            </div>

            <div class="bg-white/5 p-4 rounded-xl backdrop-blur-sm border border-white/10 relative z-10">
                <div class="h-40 w-full flex justify-center items-center">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>
        </div>

        <div class="max-w-xl mx-auto px-4">
            
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 mb-6">
                <div class="flex bg-slate-100 p-1 rounded-xl mb-4">
                    <button id="btnExpense" onclick="setType('Expense')" class="flex-1 py-2 rounded-lg text-sm font-bold bg-white text-rose-600 shadow-sm transition-all">Cheltuială</button>
                    <button id="btnIncome" onclick="setType('Income')" class="flex-1 py-2 rounded-lg text-sm font-bold text-slate-400 transition-all">Venit</button>
                </div>

                <div class="space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="date" id="dateInput" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-600">
                        <input type="number" id="amount" placeholder="Sumă (RON)" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold focus:outline-blue-500">
                    </div>
                    
                    <select id="category" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-blue-500">
                        </select>

                    <input type="text" id="description" placeholder="Descriere (opțional)" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-blue-500">

                    <button id="saveBtn" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold shadow-lg hover:bg-slate-700 active:scale-95 transition-transform mt-2">
                        Salvează
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden mb-10">
                <div class="bg-slate-50 p-3 border-b border-slate-100 flex justify-between items-center">
                    <h2 class="text-slate-700 font-bold text-sm">Tranzacții Recente</h2>
                    <div id="syncStatus" class="text-[10px] text-emerald-500 font-bold"><i class="fa-solid fa-circle"></i> Live</div>
                </div>
                <div id="transactionList" class="divide-y divide-slate-100 max-h-[500px] overflow-y-auto">
                    <div class="p-4 text-center text-slate-400 text-sm">Se încarcă...</div>
                </div>
            </div>
        </div>
    </div>

    <div id="settingsOverlay" class="fixed inset-0 bg-black/50 z-40 hidden" onclick="toggleSettings()"></div>
    <div id="settingsPanel" class="fixed inset-x-0 bottom-0 bg-white rounded-t-3xl z-50 transform translate-y-full transition-transform duration-300 h-[85vh] flex flex-col">
        
        <div class="w-full flex justify-center pt-3 pb-1" onclick="toggleSettings()">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full"></div>
        </div>

        <div class="flex-1 overflow-y-auto p-6">
            
            <div class="flex items-center gap-4 mb-8 bg-slate-50 p-4 rounded-2xl border border-slate-100">
                <img id="settingUserPhoto" src="" class="w-12 h-12 rounded-full border-2 border-white shadow-sm">
                <div class="flex-1">
                    <p class="text-xs text-slate-400 uppercase font-bold">Cont conectat</p>
                    <p id="settingUserName" class="font-bold text-slate-800">User</p>
                </div>
                <button id="logoutBtn" class="text-rose-500 text-sm font-bold bg-white px-3 py-2 rounded-lg shadow-sm border border-slate-100">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Ieșire
                </button>
            </div>

            <hr class="border-slate-100 mb-6">

            <h3 class="font-bold text-lg mb-4">⚙️ Personalizare Categorii</h3>
            
            <div class="flex bg-slate-100 p-1 rounded-xl mb-4">
                <button onclick="renderSettingsCats('Expense')" id="setTabExp" class="flex-1 py-2 rounded-lg text-sm font-bold bg-white text-rose-600 shadow-sm transition-all">Cheltuieli</button>
                <button onclick="renderSettingsCats('Income')" id="setTabInc" class="flex-1 py-2 rounded-lg text-sm font-bold text-slate-400 transition-all">Venituri</button>
            </div>

            <div class="flex gap-2 mb-4">
                <input type="text" id="newCatName" placeholder="Nume categorie nouă..." class="flex-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-blue-500">
                <button onclick="addNewCategory()" class="bg-blue-600 text-white px-4 rounded-xl font-bold hover:bg-blue-700">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>

            <div id="settingsCatList" class="space-y-2">
                </div>

            <div class="mt-8">
                 <p class="text-xs text-slate-400 uppercase font-bold mb-2">Alte Opțiuni</p>
                 <label class="flex items-center gap-3 p-4 bg-slate-50 rounded-xl border border-slate-100 cursor-pointer hover:bg-slate-100 transition">
                    <div class="bg-blue-100 text-blue-600 w-10 h-10 rounded-full flex items-center justify-center">
                        <i class="fa-solid fa-file-import"></i>
                    </div>
                    <div class="flex-1">
                        <p class="font-bold text-sm">Importă JSON Vechi</p>
                        <p class="text-xs text-slate-400">Recuperează datele vechi</p>
                    </div>
                    <input type="file" class="hidden" onchange="importData(this)">
                 </label>
            </div>
            
            <div class="h-20"></div> </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, deleteDoc, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- 1. CONFIGURARE ---
        const firebaseConfig = {
            apiKey: "AIzaSyBIVp3XbgLUgu2Q06RxCo8oM5j4YIz9V7k",
            authDomain: "budgettracker-75aa0.firebaseapp.com",
            projectId: "budgettracker-75aa0",
            storageBucket: "budgettracker-75aa0.firebasestorage.app",
            messagingSenderId: "694531423880",
            appId: "1:694531423880:web:d37237e6609899be1f693d",
            measurementId: "G-BRHXCRQYX2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // --- STATE ---
        let currentUser = null;
        let unsubscribeTx = null;
        let unsubscribeConfig = null;
        let currentType = 'Expense';
        let settingsTab = 'Expense';
        let chartInstance = null;
        let transactionsCache = [];
        
        // Default Arrays (daca userul e nou)
        let userConfig = {
            expenseCats: ["Car Expenses", "House & Utilities", "Groceries", "Dining Out", "Nightlife", "Entertainment", "Savings"],
            incomeCats: ["Salary", "Parents", "Friends", "Other"]
        };

        // --- AUTH ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                // Update UI Profile
                document.getElementById('settingUserName').innerText = user.displayName;
                document.getElementById('settingUserPhoto').src = user.photoURL;
                
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appScreen').classList.remove('hidden');
                
                initAppData();
            } else {
                currentUser = null;
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('appScreen').classList.add('hidden');
            }
        });

        document.getElementById('googleLoginBtn').addEventListener('click', () => signInWithPopup(auth, provider));
        document.getElementById('logoutBtn').addEventListener('click', () => {
            toggleSettings(); // inchide meniu
            signOut(auth);
        });

        // --- DATA SYNC ---
        async function initAppData() {
            window.setType('Expense'); 
            document.getElementById('dateInput').valueAsDate = new Date();

            // 1. Sync Categories (Config)
            const configRef = doc(db, "users", currentUser.uid, "settings", "config");
            unsubscribeConfig = onSnapshot(configRef, async (snap) => {
                if (snap.exists()) {
                    userConfig = snap.data();
                } else {
                    // Create defaults if new user
                    await setDoc(configRef, userConfig);
                }
                // Refresh UI with new cats
                window.setType(currentType);
                if(document.getElementById('settingsPanel').classList.contains('translate-y-0')) {
                    window.renderSettingsCats(settingsTab);
                }
            });

            // 2. Sync Transactions
            const q = query(collection(db, "users", currentUser.uid, "transactions"), orderBy("date", "desc"));
            unsubscribeTx = onSnapshot(q, (snapshot) => {
                const transactions = [];
                snapshot.forEach((doc) => {
                    transactions.push({ id: doc.id, ...doc.data() });
                });
                transactionsCache = transactions;
                renderApp(transactions);
            });
        }

        // --- TRANSACTION LOGIC ---
        document.getElementById('saveBtn').addEventListener('click', async () => {
            const amount = parseFloat(document.getElementById('amount').value);
            const dateVal = document.getElementById('dateInput').value;
            const cat = document.getElementById('category').value;
            const desc = document.getElementById('description').value || cat;

            if(!amount) { alert("Introdu suma!"); return; }

            const btn = document.getElementById('saveBtn');
            btn.innerText = "⏳"; btn.disabled = true;

            try {
                await addDoc(collection(db, "users", currentUser.uid, "transactions"), {
                    date: dateVal, amount: amount, category: cat, description: desc, type: currentType, createdAt: new Date()
                });
                document.getElementById('amount').value = '';
                document.getElementById('description').value = '';
                btn.innerText = "Salvează"; btn.disabled = false;
            } catch (e) { alert(e.message); btn.disabled = false; }
        });

        window.deleteTx = async (id) => {
            if(confirm("Ștergi?")) await deleteDoc(doc(db, "users", currentUser.uid, "transactions", id));
        }

        // --- SETTINGS & CATEGORY MANAGER ---
        
        window.toggleSettings = () => {
            const panel = document.getElementById('settingsPanel');
            const overlay = document.getElementById('settingsOverlay');
            
            if (panel.classList.contains('translate-y-full')) {
                // Open
                panel.classList.remove('translate-y-full', 'translate-y-0');
                panel.classList.add('translate-y-0'); // Slide up
                overlay.classList.remove('hidden');
                window.renderSettingsCats('Expense'); // default tab
            } else {
                // Close
                panel.classList.add('translate-y-full');
                panel.classList.remove('translate-y-0');
                overlay.classList.add('hidden');
            }
        }

        window.renderSettingsCats = (tabType) => {
            settingsTab = tabType;
            const list = document.getElementById('settingsCatList');
            const btnExp = document.getElementById('setTabExp');
            const btnInc = document.getElementById('setTabInc');

            // UI Tabs
            if(tabType === 'Expense') {
                btnExp.className = "flex-1 py-2 rounded-lg text-sm font-bold bg-white text-rose-600 shadow-sm transition-all";
                btnInc.className = "flex-1 py-2 rounded-lg text-sm font-bold text-slate-400 transition-all";
            } else {
                btnExp.className = "flex-1 py-2 rounded-lg text-sm font-bold text-slate-400 transition-all";
                btnInc.className = "flex-1 py-2 rounded-lg text-sm font-bold bg-white text-emerald-600 shadow-sm transition-all";
            }

            // Render List
            list.innerHTML = '';
            const cats = tabType === 'Expense' ? userConfig.expenseCats : userConfig.incomeCats;

            cats.forEach(cat => {
                const item = document.createElement('div');
                item.className = "flex justify-between items-center bg-white p-3 rounded-xl border border-slate-100";
                item.innerHTML = `
                    <span class="font-medium text-sm text-slate-700">${cat}</span>
                    <button onclick="removeCategory('${cat}')" class="text-slate-300 hover:text-red-500 p-2">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                `;
                list.appendChild(item);
            });
        }

        window.addNewCategory = async () => {
            const input = document.getElementById('newCatName');
            const name = input.value.trim();
            if(!name) return;

            const configRef = doc(db, "users", currentUser.uid, "settings", "config");
            let newCats = settingsTab === 'Expense' ? [...userConfig.expenseCats] : [...userConfig.incomeCats];
            
            if(newCats.includes(name)) { alert("Există deja!"); return; }
            newCats.push(name);

            if(settingsTab === 'Expense') await updateDoc(configRef, { expenseCats: newCats });
            else await updateDoc(configRef, { incomeCats: newCats });

            input.value = '';
        }

        window.removeCategory = async (name) => {
            if(!confirm(`Ștergi categoria "${name}"? (Tranzacțiile vechi rămân)`)) return;
            
            const configRef = doc(db, "users", currentUser.uid, "settings", "config");
            let newCats = settingsTab === 'Expense' ? [...userConfig.expenseCats] : [...userConfig.incomeCats];
            
            newCats = newCats.filter(c => c !== name);

            if(settingsTab === 'Expense') await updateDoc(configRef, { expenseCats: newCats });
            else await updateDoc(configRef, { incomeCats: newCats });
        }

        // --- CORE UI ---
        window.setType = (type) => {
            currentType = type;
            const btnExp = document.getElementById('btnExpense');
            const btnInc = document.getElementById('btnIncome');
            const catSelect = document.getElementById('category');
            
            // Populate using DYNAMIC config
            catSelect.innerHTML = '';
            const list = type === 'Expense' ? userConfig.expenseCats : userConfig.incomeCats;
            
            if(list) {
                list.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c; opt.innerText = c;
                    catSelect.appendChild(opt);
                });
            }

            if(type === 'Expense') {
                btnExp.className = "flex-1 py-2 rounded-lg text-sm font-bold bg-white text-rose-600 shadow-sm transition-all";
                btnInc.className = "flex-1 py-2 rounded-lg text-sm font-bold text-slate-400 transition-all";
            } else {
                btnExp.className = "flex-1 py-2 rounded-lg text-sm font-bold text-slate-400 transition-all";
                btnInc.className = "flex-1 py-2 rounded-lg text-sm font-bold bg-white text-emerald-600 shadow-sm transition-all";
            }
        }

        function renderApp(transactions) {
            const list = document.getElementById('transactionList');
            list.innerHTML = '';
            let inc = 0, exp = 0;
            const catTotals = {};

            if(transactions.length === 0) list.innerHTML = '<div class="p-8 text-center text-slate-400 text-sm">Nu ai tranzacții.</div>';

            transactions.forEach(t => {
                if(t.type === 'Income') inc += t.amount;
                else {
                    exp += t.amount;
                    if(!catTotals[t.category]) catTotals[t.category] = 0;
                    catTotals[t.category] += t.amount;
                }

                const isInc = t.type === 'Income';
                const dateDisp = new Date(t.date).toLocaleDateString('ro-RO', {day:'numeric', month:'short'});
                
                const div = document.createElement('div');
                div.className = "p-4 hover:bg-slate-50 flex justify-between items-center group";
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-500">
                           <i class="fa-solid fa-receipt"></i>
                        </div>
                        <div>
                            <p class="font-bold text-slate-700 text-sm">${t.description}</p>
                            <p class="text-xs text-slate-400">${dateDisp} • ${t.category}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="font-bold ${isInc ? 'text-emerald-500' : 'text-rose-500'}">${isInc ? '+' : '-'}${t.amount}</p>
                        <button onclick="deleteTx('${t.id}')" class="text-[10px] text-red-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition">Șterge</button>
                    </div>
                `;
                list.appendChild(div);
            });

            document.getElementById('totalIncome').innerText = inc;
            document.getElementById('totalExpense').innerText = exp;
            document.getElementById('balance').innerText = (inc - exp).toFixed(2) + " Lei";
            updateChart(catTotals);
        }

        function updateChart(totals) {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            if(chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(totals),
                    datasets: [{
                        data: Object.values(totals),
                        backgroundColor: ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#6366f1'],
                        borderWidth: 0
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: {display: false} }, cutout: '70%' }
            });
        }

        // --- EXPORT / IMPORT ---
        window.exportData = () => {
            if(!transactionsCache.length) { alert("Nimic de exportat!"); return; }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(transactionsCache));
            const node = document.createElement('a');
            node.href = dataStr;
            node.download = `budget_backup.json`;
            node.click();
        }

        window.importData = (input) => {
            const file = input.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                const data = JSON.parse(e.target.result);
                if(Array.isArray(data)) {
                    if(!confirm(`Importă ${data.length} tranzacții?`)) return;
                    for (const t of data) {
                        await addDoc(collection(db, "users", currentUser.uid, "transactions"), {
                            date: t.date || new Date().toISOString().slice(0,10),
                            amount: parseFloat(t.amount),
                            category: t.category,
                            description: t.description || t.category,
                            type: t.type || 'Expense',
                            createdAt: new Date()
                        });
                    }
                    alert("Gata!");
                    toggleSettings(); // Close menu if open
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
