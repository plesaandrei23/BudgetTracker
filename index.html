<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>Budget Pro Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* Fundal extins pentru a acoperi tot ecranul pe mobil */
        html { background-color: #0f172a; height: 100%; }
        body { background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; height: 100%; }
        
        .hidden { display: none !important; }
        
        /* Butoane tactile mai mari pentru mobil */
        .touch-btn { min-height: 44px; }
        
        /* Animatii */
        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body class="pb-24 text-slate-800">

    <div id="loginScreen" class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center text-white p-6 hidden">
        <i class="fa-solid fa-cloud text-6xl text-blue-500 mb-6"></i>
        <h1 class="text-3xl font-bold mb-2">Budget Pro</h1>
        <p class="text-slate-400 mb-8 text-center">Login pentru sincronizare</p>
        <button id="googleLoginBtn" class="bg-white text-slate-900 px-6 py-4 rounded-2xl font-bold flex items-center gap-3 active:scale-95 transition w-full justify-center max-w-xs">
            <i class="fa-brands fa-google text-red-500 text-xl"></i> Continuă cu Google
        </button>
    </div>

    <div id="appScreen" class="hidden">
        
        <div class="bg-slate-900 text-white pt-[max(20px,env(safe-area-inset-top))] pb-8 px-6 rounded-b-[2.5rem] shadow-xl mb-6 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-40 h-40 bg-blue-500 rounded-full mix-blend-overlay filter blur-[60px] opacity-20 pointer-events-none"></div>
            
            <div class="flex justify-between items-center mb-6 mt-2 relative z-10">
                <h1 class="text-xl font-bold tracking-tight">Budget Pro</h1>
                
                <div class="flex gap-3">
                    <button onclick="exportData()" class="bg-white/10 w-10 h-10 rounded-xl active:bg-white/20 flex items-center justify-center backdrop-blur-sm transition" title="Backup">
                        <i class="fa-solid fa-cloud-arrow-down"></i>
                    </button>
                    <button onclick="toggleSettings()" class="bg-white/10 w-10 h-10 rounded-xl active:bg-white/20 flex items-center justify-center backdrop-blur-sm transition" title="Setări">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>
            </div>

            <div class="flex justify-between items-end mb-6 relative z-10">
                <div>
                    <p class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Balanță Totală</p>
                    <p class="text-4xl font-extrabold tracking-tight" id="balance">...</p>
                </div>
                <div class="text-right space-y-1">
                    <div class="flex items-center justify-end gap-2 text-emerald-400">
                        <i class="fa-solid fa-arrow-down text-xs"></i><span class="font-bold text-lg" id="totalIncome">0</span>
                    </div>
                    <div class="flex items-center justify-end gap-2 text-rose-400">
                        <i class="fa-solid fa-arrow-up text-xs"></i><span class="font-bold text-lg" id="totalExpense">0</span>
                    </div>
                </div>
            </div>

            <div class="bg-white/5 p-4 rounded-2xl backdrop-blur-md border border-white/10 relative z-10 shadow-lg">
                <div class="h-40 w-full flex justify-center items-center">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>
        </div>

        <div class="max-w-xl mx-auto px-4">
            
            <div id="formCard" class="bg-white p-5 rounded-3xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] border border-slate-100 mb-6 transition-all duration-300">
                
                <div class="flex justify-between items-center mb-4 hidden" id="editHeader">
                    <span class="text-xs font-bold text-blue-600 uppercase">Modifică Tranzacție</span>
                    <button onclick="cancelEdit()" class="text-xs bg-slate-100 text-slate-500 px-2 py-1 rounded-lg">Anulează</button>
                </div>

                <div class="flex bg-slate-100 p-1.5 rounded-2xl mb-4">
                    <button id="btnExpense" onclick="setType('Expense')" class="touch-btn flex-1 rounded-xl text-sm font-bold bg-white text-rose-600 shadow-sm transition-all">Cheltuială</button>
                    <button id="btnIncome" onclick="setType('Income')" class="touch-btn flex-1 rounded-xl text-sm font-bold text-slate-400 transition-all">Venit</button>
                </div>

                <div class="space-y-4">
                    <div class="grid grid-cols-5 gap-3">
                        <div class="col-span-2 relative">
                             <input type="date" id="dateInput" class="w-full h-12 pl-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-600 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div class="col-span-3">
                            <input type="number" id="amount" placeholder="Sumă" class="w-full h-12 px-4 bg-slate-50 border border-slate-200 rounded-xl text-lg font-bold text-slate-800 placeholder-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                    </div>
                    
                    <select id="category" class="w-full h-12 px-4 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-700 focus:ring-2 focus:ring-blue-500 focus:outline-none appearance-none">
                        </select>

                    <input type="text" id="description" placeholder="Descriere (opțional)" class="w-full h-12 px-4 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">

                    <button id="saveBtn" class="touch-btn w-full bg-slate-800 text-white rounded-xl font-bold text-lg shadow-lg active:scale-[0.98] transition-transform mt-2 flex items-center justify-center gap-2">
                        <span>Salvează</span>
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden mb-10 min-h-[200px]">
                <div class="bg-slate-50/80 backdrop-blur p-4 border-b border-slate-100 flex justify-between items-center sticky top-0 z-20">
                    <h2 class="text-slate-700 font-bold text-sm">Istoric Tranzacții</h2>
                    <div id="syncStatus" class="text-[10px] text-emerald-500 font-bold flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500 block"></span> Live</div>
                </div>
                <div id="transactionList" class="divide-y divide-slate-50">
                    <div class="p-8 text-center text-slate-400 text-sm">Se încarcă datele...</div>
                </div>
            </div>
        </div>
    </div>

    <div id="settingsOverlay" class="fixed inset-0 bg-black/60 z-40 hidden backdrop-blur-sm transition-opacity" onclick="toggleSettings()"></div>
    <div id="settingsPanel" class="fixed inset-x-0 bottom-0 bg-white rounded-t-[2rem] z-50 transform translate-y-full transition-transform duration-300 h-[85vh] flex flex-col shadow-2xl">
        
        <div class="w-full flex justify-center pt-4 pb-2" onclick="toggleSettings()">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full"></div>
        </div>

        <div class="flex-1 overflow-y-auto p-6">
            <div class="flex items-center gap-4 mb-8 bg-slate-50 p-4 rounded-2xl border border-slate-100">
                <img id="settingUserPhoto" src="" class="w-12 h-12 rounded-full bg-slate-200">
                <div class="flex-1">
                    <p class="text-xs text-slate-400 uppercase font-bold">Cont</p>
                    <p id="settingUserName" class="font-bold text-slate-800 truncate">User</p>
                </div>
                <button id="logoutBtn" class="text-rose-500 bg-white px-4 py-2 rounded-xl shadow-sm border border-slate-100 font-bold text-sm">Ieșire</button>
            </div>

            <h3 class="font-bold text-lg mb-4 text-slate-800">Categorii Personalizate</h3>
            
            <div class="flex bg-slate-100 p-1 rounded-xl mb-4">
                <button onclick="renderSettingsCats('Expense')" id="setTabExp" class="flex-1 py-2.5 rounded-lg text-sm font-bold bg-white text-rose-600 shadow-sm">Cheltuieli</button>
                <button onclick="renderSettingsCats('Income')" id="setTabInc" class="flex-1 py-2.5 rounded-lg text-sm font-bold text-slate-400">Venituri</button>
            </div>

            <div class="flex gap-2 mb-4">
                <input type="text" id="newCatName" placeholder="Categorie nouă..." class="flex-1 h-12 px-4 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium">
                <button onclick="addNewCategory()" class="bg-blue-600 text-white w-12 h-12 rounded-xl flex items-center justify-center text-lg active:bg-blue-700 transition">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>

            <div id="settingsCatList" class="space-y-2 pb-10">
                </div>
            
            <div class="mt-8 mb-10">
                 <p class="text-xs text-slate-400 uppercase font-bold mb-3">Zonă Periculoasă</p>
                 <label class="flex items-center gap-3 p-4 bg-slate-50 rounded-2xl border border-slate-100 active:bg-slate-100 transition">
                    <div class="bg-blue-100 text-blue-600 w-10 h-10 rounded-full flex items-center justify-center">
                        <i class="fa-solid fa-file-import"></i>
                    </div>
                    <div class="flex-1">
                        <p class="font-bold text-sm text-slate-700">Importă JSON Vechi</p>
                        <p class="text-xs text-slate-400">Restaurează date pierdute</p>
                    </div>
                    <input type="file" class="hidden" onchange="importData(this)">
                 </label>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, deleteDoc, doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- CONFIG ---
        
        const firebaseConfig = {
            apiKey: "AIzaSyBIVp3XbgLUgu2Q06RxCo8oM5j4YIz9V7k",
            authDomain: "budgettracker-75aa0.firebaseapp.com",
            projectId: "budgettracker-75aa0",
            storageBucket: "budgettracker-75aa0.firebasestorage.app",
            messagingSenderId: "694531423880",
            appId: "1:694531423880:web:d37237e6609899be1f693d",
            measurementId: "G-BRHXCRQYX2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let currentType = 'Expense';
        let settingsTab = 'Expense';
        let chartInstance = null;
        let transactionsCache = [];
        let editingId = null; // Pentru Edit Mode
        
        let userConfig = {
            expenseCats: ["Car Expenses", "House & Utilities", "Groceries", "Dining Out", "Nightlife", "Entertainment", "Savings"],
            incomeCats: ["Salary", "Parents", "Friends", "Other"]
        };

        // --- AUTH ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('settingUserName').innerText = user.displayName;
                document.getElementById('settingUserPhoto').src = user.photoURL || 'https://via.placeholder.com/50';
                
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appScreen').classList.remove('hidden');
                
                initAppData();
            } else {
                currentUser = null;
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('appScreen').classList.add('hidden');
            }
        });

        document.getElementById('googleLoginBtn').addEventListener('click', () => signInWithPopup(auth, provider));
        document.getElementById('logoutBtn').addEventListener('click', () => { toggleSettings(); signOut(auth); });

        // --- CORE LOGIC ---
        function initAppData() {
            window.setType('Expense'); 
            document.getElementById('dateInput').valueAsDate = new Date();

            // Sync Config
            const configRef = doc(db, "users", currentUser.uid, "settings", "config");
            onSnapshot(configRef, (snap) => {
                if (snap.exists()) userConfig = snap.data();
                else setDoc(configRef, userConfig);
                window.setType(currentType); // Refresh dropdown
                if(document.getElementById('settingsPanel').classList.contains('translate-y-0')) window.renderSettingsCats(settingsTab);
            });

            // Sync Transacții
            const q = query(collection(db, "users", currentUser.uid, "transactions"), orderBy("date", "desc"));
            onSnapshot(q, (snapshot) => {
                const txs = [];
                snapshot.forEach((d) => txs.push({ id: d.id, ...d.data() }));
                transactionsCache = txs;
                renderApp(txs);
            });
        }

        // --- ADD / EDIT / DELETE ---
        document.getElementById('saveBtn').addEventListener('click', async () => {
            const amount = parseFloat(document.getElementById('amount').value);
            const dateVal = document.getElementById('dateInput').value;
            const cat = document.getElementById('category').value;
            const desc = document.getElementById('description').value || cat;

            if(!amount) { alert("Introdu suma!"); return; }

            const btn = document.getElementById('saveBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i>"; 
            btn.disabled = true;

            try {
                if(editingId) {
                    // UPDATE existent
                    await updateDoc(doc(db, "users", currentUser.uid, "transactions", editingId), {
                        date: dateVal, amount: amount, category: cat, description: desc, type: currentType
                    });
                    window.cancelEdit(); // Iesi din edit mode
                } else {
                    // CREATE nou
                    await addDoc(collection(db, "users", currentUser.uid, "transactions"), {
                        date: dateVal, amount: amount, category: cat, description: desc, type: currentType, createdAt: new Date()
                    });
                    // Reset fields only on new add
                    document.getElementById('amount').value = '';
                    document.getElementById('description').value = '';
                }
            } catch (e) { alert("Eroare: " + e.message); }
            
            btn.innerHTML = originalText; 
            btn.disabled = false;
        });

        // Functie pentru a porni editarea (Populeaza formularul)
        window.editTx = (id) => {
            const tx = transactionsCache.find(t => t.id === id);
            if(!tx) return;

            editingId = id;
            
            // Schimba UI in modul Edit
            document.getElementById('editHeader').classList.remove('hidden');
            document.getElementById('saveBtn').innerHTML = "Actualizează Tranzacția";
            document.getElementById('saveBtn').classList.remove('bg-slate-800');
            document.getElementById('saveBtn').classList.add('bg-blue-600');
            
            // Scroll sus la formular
            document.getElementById('appScreen').scrollIntoView({ behavior: 'smooth' });

            // Populeaza campurile
            window.setType(tx.type); // Seteaza tabul corect
            setTimeout(() => {
                document.getElementById('dateInput').value = tx.date;
                document.getElementById('amount').value = tx.amount;
                document.getElementById('category').value = tx.category;
                document.getElementById('description').value = tx.description;
            }, 50);
        }

        window.cancelEdit = () => {
            editingId = null;
            document.getElementById('editHeader').classList.add('hidden');
            document.getElementById('saveBtn').innerHTML = "Salvează";
            document.getElementById('saveBtn').classList.add('bg-slate-800');
            document.getElementById('saveBtn').classList.remove('bg-blue-600');
            document.getElementById('amount').value = '';
            document.getElementById('description').value = '';
            document.getElementById('dateInput').valueAsDate = new Date();
        }

        window.deleteTx = async (id) => {
            if(confirm("Ștergi definitiv?")) {
                if(editingId === id) window.cancelEdit();
                await deleteDoc(doc(db, "users", currentUser.uid, "transactions", id));
            }
        }

        // --- RENDER ---
        function renderApp(transactions) {
            const list = document.getElementById('transactionList');
            list.innerHTML = '';
            let inc = 0, exp = 0;
            const catTotals = {};

            if(transactions.length === 0) list.innerHTML = '<div class="p-8 text-center text-slate-400 text-sm">Nu ai tranzacții.</div>';

            transactions.forEach(t => {
                if(t.type === 'Income') inc += t.amount;
                else {
                    exp += t.amount;
                    catTotals[t.category] = (catTotals[t.category] || 0) + t.amount;
                }

                const isInc = t.type === 'Income';
                const dateDisp = new Date(t.date).toLocaleDateString('ro-RO', {day:'numeric', month:'short'});
                
                // Card Tranzactie optimizat pt Mobile
                const div = document.createElement('div');
                div.className = "p-4 flex justify-between items-center active:bg-slate-50 transition-colors";
                div.innerHTML = `
                    <div class="flex items-center gap-3.5 overflow-hidden">
                        <div class="w-10 h-10 rounded-full bg-slate-100 flex-shrink-0 flex items-center justify-center text-slate-500 text-sm">
                           <i class="fa-solid fa-receipt"></i>
                        </div>
                        <div class="min-w-0">
                            <p class="font-bold text-slate-700 text-sm truncate pr-2">${t.description}</p>
                            <p class="text-xs text-slate-400 font-medium">${dateDisp} • ${t.category}</p>
                        </div>
                    </div>
                    <div class="flex flex-col items-end gap-1 flex-shrink-0 ml-2">
                        <p class="font-bold ${isInc ? 'text-emerald-500' : 'text-rose-500'} text-base">${isInc ? '+' : '-'}${t.amount}</p>
                        
                        <div class="flex gap-3 mt-0.5">
                            <button onclick="editTx('${t.id}')" class="text-slate-300 hover:text-blue-500 p-1">
                                <i class="fa-solid fa-pen text-xs"></i>
                            </button>
                            <button onclick="deleteTx('${t.id}')" class="text-slate-300 hover:text-rose-500 p-1">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
                list.appendChild(div);
            });

            document.getElementById('totalIncome').innerText = inc;
            document.getElementById('totalExpense').innerText = exp;
            document.getElementById('balance').innerText = (inc - exp).toFixed(2) + " Lei";
            updateChart(catTotals);
        }

        function updateChart(totals) {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            if(chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(totals),
                    datasets: [{
                        data: Object.values(totals),
                        backgroundColor: ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#6366f1'],
                        borderWidth: 0,
                        hoverOffset: 10
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: {display: false} }, cutout: '75%' }
            });
        }

        // --- SETTINGS UI ---
        window.toggleSettings = () => {
            const panel = document.getElementById('settingsPanel');
            const overlay = document.getElementById('settingsOverlay');
            if (panel.classList.contains('translate-y-full')) {
                panel.classList.remove('translate-y-full'); panel.classList.add('translate-y-0');
                overlay.classList.remove('hidden'); overlay.classList.remove('opacity-0');
                window.renderSettingsCats('Expense');
            } else {
                panel.classList.add('translate-y-full'); panel.classList.remove('translate-y-0');
                overlay.classList.add('hidden'); overlay.classList.add('opacity-0');
            }
        }

        window.setType = (type) => {
            currentType = type;
            const btnExp = document.getElementById('btnExpense');
            const btnInc = document.getElementById('btnIncome');
            const catSelect = document.getElementById('category');
            
            catSelect.innerHTML = '';
            const list = type === 'Expense' ? userConfig.expenseCats : userConfig.incomeCats;
            if(list) list.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c; opt.innerText = c; catSelect.appendChild(opt);
            });

            if(type === 'Expense') {
                btnExp.className = "touch-btn flex-1 rounded-xl text-sm font-bold bg-white text-rose-600 shadow-sm transition-all";
                btnInc.className = "touch-btn flex-1 rounded-xl text-sm font-bold text-slate-400 transition-all";
            } else {
                btnExp.className = "touch-btn flex-1 rounded-xl text-sm font-bold text-slate-400 transition-all";
                btnInc.className = "touch-btn flex-1 rounded-xl text-sm font-bold bg-white text-emerald-600 shadow-sm transition-all";
            }
        }
        
        // --- CATEGORY MANAGER ---
        window.renderSettingsCats = (tab) => {
            settingsTab = tab;
            const list = document.getElementById('settingsCatList');
            const btnExp = document.getElementById('setTabExp');
            const btnInc = document.getElementById('setTabInc');

            if(tab === 'Expense') {
                btnExp.className = "flex-1 py-2.5 rounded-lg text-sm font-bold bg-white text-rose-600 shadow-sm transition-all";
                btnInc.className = "flex-1 py-2.5 rounded-lg text-sm font-bold text-slate-400 transition-all";
            } else {
                btnExp.className = "flex-1 py-2.5 rounded-lg text-sm font-bold text-slate-400 transition-all";
                btnInc.className = "flex-1 py-2.5 rounded-lg text-sm font-bold bg-white text-emerald-600 shadow-sm transition-all";
            }

            list.innerHTML = '';
            const cats = tab === 'Expense' ? userConfig.expenseCats : userConfig.incomeCats;
            cats.forEach(c => {
                const item = document.createElement('div');
                item.className = "flex justify-between items-center bg-white p-4 rounded-xl border border-slate-100";
                item.innerHTML = `
                    <span class="font-bold text-sm text-slate-700">${c}</span>
                    <button onclick="removeCat('${c}')" class="text-slate-300 hover:text-red-500 w-8 h-8 flex items-center justify-center"><i class="fa-solid fa-trash"></i></button>
                `;
                list.appendChild(item);
            });
        }

        window.addNewCategory = async () => {
            const input = document.getElementById('newCatName');
            const name = input.value.trim();
            if(!name) return;
            const ref = doc(db, "users", currentUser.uid, "settings", "config");
            let list = settingsTab === 'Expense' ? [...userConfig.expenseCats] : [...userConfig.incomeCats];
            if(!list.includes(name)) {
                list.push(name);
                await updateDoc(ref, settingsTab === 'Expense' ? { expenseCats: list } : { incomeCats: list });
            }
            input.value = '';
        }

        window.removeCat = async (name) => {
            if(!confirm("Ștergi categoria?")) return;
            const ref = doc(db, "users", currentUser.uid, "settings", "config");
            let list = settingsTab === 'Expense' ? [...userConfig.expenseCats] : [...userConfig.incomeCats];
            list = list.filter(c => c !== name);
            await updateDoc(ref, settingsTab === 'Expense' ? { expenseCats: list } : { incomeCats: list });
        }

        window.importData = (i) => {
            const f = i.files[0]; if(!f) return;
            const r = new FileReader();
            r.onload = async(e) => {
                const d = JSON.parse(e.target.result);
                if(confirm(`Import ${d.length} iteme?`)) {
                    for(const t of d) await addDoc(collection(db,"users",currentUser.uid,"transactions"),{...t, createdAt:new Date()});
                    alert("Import complet!"); toggleSettings();
                }
            };
            r.readAsText(f);
        }
    </script>
</body>
</html>
