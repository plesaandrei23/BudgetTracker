<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>Budget Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* CSS Reset */
        * { -webkit-tap-highlight-color: transparent; }
        
        /* 1. FUNDALUL PAGINII = DARK BLUE (Rezolva bara alba de sus) */
        html { background-color: #0f172a; height: 100%; }
        body { 
            background-color: #0f172a; /* Asigura continuitate */
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            display: flex; justify-content: center;
        }

        /* 2. CONTAINER PRINCIPAL (Telefonul) */
        #app-container {
            width: 100%;
            height: 100%;
            background-color: #f8fafc; /* Interiorul aplicatiei e deschis */
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* STIL DE DESKTOP (Doar daca ecranul e mare) */
        @media (min-width: 640px) {
            body {
                align-items: center; /* Centreaza telefonul */
                background-color: #e2e8f0; /* Fundal gri pe PC */
            }
            #app-container {
                max-width: 400px;
                height: 850px;
                max-height: 95vh;
                border-radius: 40px;
                /* Rama telefonului */
                box-shadow: 0 0 0 10px #0f172a, 0 25px 50px -12px rgba(0, 0, 0, 0.5);
                /* Mascheaza colturile */
                mask-image: -webkit-radial-gradient(white, black);
                -webkit-mask-image: -webkit-radial-gradient(white, black);
            }
        }

        /* Scroll Area invizibil */
        #scroll-content {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
            scrollbar-width: none; 
        }
        #scroll-content::-webkit-scrollbar { display: none; }

        .hidden { display: none !important; }
        
        /* Animatie Login */
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .float-anim { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body>

    <div id="app-container">
        
        <div id="loginScreen" class="absolute inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center text-white p-6 hidden">
            <div class="w-24 h-24 bg-blue-600 rounded-3xl flex items-center justify-center mb-8 shadow-lg shadow-blue-500/30 float-anim">
                <i class="fa-solid fa-wallet text-5xl"></i>
            </div>
            <h1 class="text-3xl font-bold mb-2 tracking-tight">Budget Pro</h1>
            <p class="text-slate-400 mb-12 text-center text-sm">Controlează-ți finanțele simplu.</p>
            <button id="googleLoginBtn" class="bg-white text-slate-900 px-8 py-4 rounded-2xl font-bold flex items-center gap-3 active:scale-95 transition shadow-xl w-full max-w-xs justify-center">
                <i class="fa-brands fa-google text-red-500 text-xl"></i> Login cu Google
            </button>
        </div>

        <div id="appHeader" class="bg-slate-900 text-white pt-[max(20px,env(safe-area-inset-top))] px-6 pb-6 relative shrink-0 hidden z-20 rounded-b-[2.5rem] shadow-2xl">
            
            <div class="absolute top-0 right-0 w-64 h-64 bg-blue-600 rounded-full mix-blend-overlay filter blur-[80px] opacity-20 pointer-events-none"></div>

            <div class="flex justify-between items-center mb-6 mt-2 relative z-10">
                <div class="flex items-center gap-3">
                    <img id="userPhoto" src="" class="w-10 h-10 rounded-full border-2 border-slate-700 bg-slate-800">
                    <div>
                        <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Salut,</p>
                        <p id="userName" class="text-sm font-bold leading-none">User</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="exportData()" class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center active:bg-white/20 transition backdrop-blur-md">
                        <i class="fa-solid fa-cloud-arrow-down"></i>
                    </button>
                    <button onclick="toggleSettings()" class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center active:bg-white/20 transition backdrop-blur-md">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>
            </div>

            <div class="flex items-end justify-between relative z-10">
                <div>
                    <p class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Balanță Totală</p>
                    <p class="text-4xl font-extrabold tracking-tight" id="balance">0.00 Lei</p>
                </div>
                <div class="flex flex-col gap-1.5 text-right">
                    <div class="flex items-center justify-end gap-2 px-3 py-1.5 rounded-lg bg-emerald-500/10 border border-emerald-500/20">
                        <i class="fa-solid fa-arrow-down text-emerald-400 text-xs"></i>
                        <span class="font-bold text-emerald-400 text-sm" id="totalIncome">0</span>
                    </div>
                    <div class="flex items-center justify-end gap-2 px-3 py-1.5 rounded-lg bg-rose-500/10 border border-rose-500/20">
                        <i class="fa-solid fa-arrow-up text-rose-400 text-xs"></i>
                        <span class="font-bold text-rose-400 text-sm" id="totalExpense">0</span>
                    </div>
                </div>
            </div>
            
            <div id="chartContainer" class="mt-4 h-0 overflow-hidden transition-all duration-300 relative z-10">
                 <div class="h-40 flex justify-center"><canvas id="expenseChart"></canvas></div>
            </div>
            
            <div class="absolute bottom-0 left-0 w-full flex justify-center translate-y-1/2 z-20">
                <button onclick="toggleChart()" class="bg-slate-800 text-slate-400 w-10 h-10 rounded-full flex items-center justify-center shadow-lg border-4 border-slate-50 text-xs active:scale-90 transition">
                    <i class="fa-solid fa-chevron-down transition-transform duration-300" id="chartIcon"></i>
                </button>
            </div>
        </div>

        <div id="scroll-content" class="hidden bg-slate-50 pt-10 px-4 pb-24">
            
            <div id="formCard" class="bg-white p-5 rounded-3xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] border border-slate-100 mb-6 relative z-10">
                
                <div id="editHeader" class="flex justify-between items-center mb-4 hidden bg-blue-50 p-2.5 rounded-xl border border-blue-100">
                    <span class="text-xs font-bold text-blue-600 uppercase flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span> Modifici Tranzacție
                    </span>
                    <button onclick="cancelEdit()" class="w-6 h-6 rounded-full bg-white text-slate-400 flex items-center justify-center shadow-sm"><i class="fa-solid fa-xmark text-xs"></i></button>
                </div>

                <div class="flex bg-slate-100 p-1.5 rounded-2xl mb-4">
                    <button id="btnExpense" onclick="setType('Expense')" class="flex-1 py-3 rounded-xl text-sm font-bold bg-white text-rose-600 shadow-sm transition-all">Cheltuială</button>
                    <button id="btnIncome" onclick="setType('Income')" class="flex-1 py-3 rounded-xl text-sm font-bold text-slate-400 transition-all">Venit</button>
                </div>

                <div class="space-y-3">
                    <div class="grid grid-cols-5 gap-3">
                        <input type="date" id="dateInput" class="col-span-2 h-12 pl-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-600 focus:outline-blue-500 focus:ring-2 focus:ring-blue-100 transition-all">
                        <input type="number" id="amount" placeholder="Sumă" class="col-span-3 h-12 px-4 bg-slate-50 border border-slate-200 rounded-xl text-lg font-bold text-slate-800 placeholder-slate-300 focus:outline-blue-500 focus:ring-2 focus:ring-blue-100 transition-all">
                    </div>
                    
                    <select id="category" class="w-full h-12 px-4 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-700 focus:outline-blue-500 focus:ring-2 focus:ring-blue-100 appearance-none">
                        </select>

                    <input type="text" id="description" placeholder="Descriere (opțional)" class="w-full h-12 px-4 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-blue-500 focus:ring-2 focus:ring-blue-100 transition-all">

                    <button id="saveBtn" class="w-full bg-slate-900 text-white h-12 rounded-xl font-bold text-base shadow-lg shadow-slate-900/20 active:scale-[0.98] transition-transform flex items-center justify-center gap-2 mt-2">
                        Salvează
                    </button>
                </div>
            </div>

            <div class="flex justify-between items-center px-2 mb-3">
                <h2 class="text-slate-900 font-bold text-lg tracking-tight">Tranzacții Recente</h2>
                <div class="text-[10px] font-bold bg-emerald-100 text-emerald-600 px-2.5 py-1 rounded-full flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Sync
                </div>
            </div>

            <div id="transactionList" class="space-y-3 pb-20">
                <div class="p-10 text-center text-slate-400 text-sm">Se încarcă...</div>
            </div>
        </div>
    </div>

    <div id="settingsOverlay" class="absolute inset-0 bg-slate-900/50 z-40 hidden backdrop-blur-sm transition-opacity" onclick="toggleSettings()"></div>
    <div id="settingsPanel" class="absolute inset-x-0 bottom-0 bg-white rounded-t-[2rem] z-50 transform translate-y-full transition-transform duration-300 h-[85%] flex flex-col shadow-2xl">
        <div class="w-full flex justify-center pt-4 pb-2" onclick="toggleSettings()"><div class="w-12 h-1.5 bg-slate-200 rounded-full"></div></div>
        
        <div class="flex-1 overflow-y-auto p-6 pb-20">
            <h3 class="font-bold text-lg mb-4 text-slate-800">Setări Categorii</h3>
            
            <div class="flex bg-slate-100 p-1 rounded-xl mb-4">
                <button onclick="renderSettingsCats('Expense')" id="setTabExp" class="flex-1 py-2.5 rounded-lg text-sm font-bold bg-white text-rose-600 shadow-sm">Cheltuieli</button>
                <button onclick="renderSettingsCats('Income')" id="setTabInc" class="flex-1 py-2.5 rounded-lg text-sm font-bold text-slate-400">Venituri</button>
            </div>

            <div class="flex gap-2 mb-4">
                <input type="text" id="newCatName" placeholder="Nume categorie..." class="flex-1 h-12 px-4 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium">
                <button onclick="addNewCategory()" class="bg-blue-600 text-white w-12 h-12 rounded-xl flex items-center justify-center text-lg active:bg-blue-700 transition"><i class="fa-solid fa-plus"></i></button>
            </div>

            <div id="settingsCatList" class="space-y-2"></div>
            
            <div class="mt-8">
                 <button id="logoutBtn" class="w-full text-rose-500 bg-rose-50 py-3.5 rounded-xl font-bold text-sm border border-rose-100">Ieșire din cont</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, deleteDoc, doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- ⚠️ PUNE DATELE TALE AICI ⚠️ ---
        const firebaseConfig = {
            apiKey: "AIzaSyBIVp3XbgLUgu2Q06RxCo8oM5j4YIz9V7k",
            authDomain: "budgettracker-75aa0.firebaseapp.com",
            projectId: "budgettracker-75aa0",
            storageBucket: "budgettracker-75aa0.firebasestorage.app",
            messagingSenderId: "694531423880",
            appId: "1:694531423880:web:d37237e6609899be1f693d",
            measurementId: "G-BRHXCRQYX2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let currentType = 'Expense';
        let settingsTab = 'Expense';
        let chartInstance = null;
        let transactionsCache = [];
        let editingId = null;
        let isChartOpen = false;
        
        let userConfig = {
            expenseCats: ["Mâncare", "Transport", "Casă", "Distracție", "Educație", "Economii"],
            incomeCats: ["Salariu", "Părinți", "Freelance", "Altele"]
        };

        // --- AUTH ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('userName').innerText = user.displayName;
                document.getElementById('userPhoto').src = user.photoURL;
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appHeader').classList.remove('hidden');
                document.getElementById('scroll-content').classList.remove('hidden');
                initAppData();
            } else {
                currentUser = null;
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('appHeader').classList.add('hidden');
                document.getElementById('scroll-content').classList.add('hidden');
            }
        });

        document.getElementById('googleLoginBtn').addEventListener('click', () => signInWithPopup(auth, provider));
        document.getElementById('logoutBtn').addEventListener('click', () => { toggleSettings(); signOut(auth); });

        // --- APP LOGIC ---
        function initAppData() {
            window.setType('Expense'); 
            document.getElementById('dateInput').valueAsDate = new Date();

            const configRef = doc(db, "users", currentUser.uid, "settings", "config");
            onSnapshot(configRef, (snap) => {
                if (snap.exists()) userConfig = snap.data();
                else setDoc(configRef, userConfig);
                window.setType(currentType);
            });

            const q = query(collection(db, "users", currentUser.uid, "transactions"), orderBy("date", "desc"));
            onSnapshot(q, (snapshot) => {
                const txs = [];
                snapshot.forEach((d) => txs.push({ id: d.id, ...d.data() }));
                transactionsCache = txs;
                renderApp(txs);
            });
        }

        document.getElementById('saveBtn').addEventListener('click', async () => {
            const amount = parseFloat(document.getElementById('amount').value);
            const dateVal = document.getElementById('dateInput').value;
            const cat = document.getElementById('category').value;
            const desc = document.getElementById('description').value || cat;

            if(!amount) { alert("Introdu suma!"); return; }

            const btn = document.getElementById('saveBtn');
            btn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i>"; 
            btn.disabled = true;

            try {
                if(editingId) {
                    await updateDoc(doc(db, "users", currentUser.uid, "transactions", editingId), {
                        date: dateVal, amount: amount, category: cat, description: desc, type: currentType
                    });
                    window.cancelEdit();
                } else {
                    await addDoc(collection(db, "users", currentUser.uid, "transactions"), {
                        date: dateVal, amount: amount, category: cat, description: desc, type: currentType, createdAt: new Date()
                    });
                    document.getElementById('amount').value = '';
                    document.getElementById('description').value = '';
                }
            } catch (e) { alert("Eroare"); }
            
            btn.innerHTML = "Salvează"; btn.disabled = false;
        });

        window.editTx = (id) => {
            const tx = transactionsCache.find(t => t.id === id);
            if(!tx) return;
            editingId = id;
            document.getElementById('editHeader').classList.remove('hidden');
            document.getElementById('saveBtn').innerText = "Actualizează";
            document.getElementById('saveBtn').classList.replace('bg-slate-900', 'bg-blue-600');
            document.getElementById('scroll-content').scrollTop = 0;
            
            window.setType(tx.type);
            setTimeout(() => {
                document.getElementById('dateInput').value = tx.date;
                document.getElementById('amount').value = tx.amount;
                document.getElementById('category').value = tx.category;
                document.getElementById('description').value = tx.description;
            }, 50);
        }

        window.cancelEdit = () => {
            editingId = null;
            document.getElementById('editHeader').classList.add('hidden');
            document.getElementById('saveBtn').innerText = "Salvează";
            document.getElementById('saveBtn').classList.replace('bg-blue-600', 'bg-slate-900');
            document.getElementById('amount').value = '';
            document.getElementById('description').value = '';
        }

        window.deleteTx = async (id) => {
            if(confirm("Ștergi?")) {
                if(editingId === id) window.cancelEdit();
                await deleteDoc(doc(db, "users", currentUser.uid, "transactions", id));
            }
        }

        function renderApp(transactions) {
            const list = document.getElementById('transactionList');
            list.innerHTML = '';
            let inc = 0, exp = 0;
            const catTotals = {};

            if(transactions.length === 0) list.innerHTML = '<div class="p-8 text-center text-slate-400 text-sm">Nu ai tranzacții.</div>';

            transactions.forEach(t => {
                if(t.type === 'Income') inc += t.amount;
                else {
                    exp += t.amount;
                    catTotals[t.category] = (catTotals[t.category] || 0) + t.amount;
                }

                const isInc = t.type === 'Income';
                const dateDisp = new Date(t.date).toLocaleDateString('ro-RO', {day:'numeric', month:'short'});
                
                const div = document.createElement('div');
                div.className = "bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex justify-between items-center active:bg-slate-50 transition";
                div.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="w-10 h-10 rounded-full bg-slate-50 flex-shrink-0 flex items-center justify-center text-slate-400">
                           <i class="fa-solid ${isInc ? 'fa-wallet' : 'fa-receipt'}"></i>
                        </div>
                        <div class="min-w-0">
                            <p class="font-bold text-slate-800 text-sm truncate pr-2">${t.description}</p>
                            <p class="text-xs text-slate-400 font-medium">${dateDisp} • ${t.category}</p>
                        </div>
                    </div>
                    <div class="flex flex-col items-end gap-1 flex-shrink-0">
                        <p class="font-bold ${isInc ? 'text-emerald-500' : 'text-slate-800'} text-base">${isInc ? '+' : '-'}${t.amount}</p>
                        <div class="flex gap-3">
                            <button onclick="editTx('${t.id}')" class="text-slate-300 hover:text-blue-500 p-1"><i class="fa-solid fa-pen text-xs"></i></button>
                            <button onclick="deleteTx('${t.id}')" class="text-slate-300 hover:text-rose-500 p-1"><i class="fa-solid fa-trash text-xs"></i></button>
                        </div>
                    </div>
                `;
                list.appendChild(div);
            });

            document.getElementById('totalIncome').innerText = inc;
            document.getElementById('totalExpense').innerText = exp;
            document.getElementById('balance').innerText = (inc - exp).toFixed(2) + " Lei";
            updateChart(catTotals);
        }

        function updateChart(totals) {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            if(chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(totals),
                    datasets: [{
                        data: Object.values(totals),
                        backgroundColor: ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: {display: false} }, cutout: '75%' }
            });
        }

        window.toggleChart = () => {
            const container = document.getElementById('chartContainer');
            const icon = document.getElementById('chartIcon');
            isChartOpen = !isChartOpen;
            if(isChartOpen) {
                container.style.height = "160px"; icon.style.transform = "rotate(180deg)";
            } else {
                container.style.height = "0px"; icon.style.transform = "rotate(0deg)";
            }
        }

        window.toggleSettings = () => {
            const panel = document.getElementById('settingsPanel');
            const overlay = document.getElementById('settingsOverlay');
            if (panel.classList.contains('translate-y-full')) {
                panel.classList.remove('translate-y-full'); panel.classList.add('translate-y-0');
                overlay.classList.remove('hidden'); window.renderSettingsCats('Expense');
            } else {
                panel.classList.add('translate-y-full'); panel.classList.remove('translate-y-0');
                overlay.classList.add('hidden');
            }
        }

        window.setType = (type) => {
            currentType = type;
            const btnExp = document.getElementById('btnExpense');
            const btnInc = document.getElementById('btnIncome');
            const catSelect = document.getElementById('category');
            catSelect.innerHTML = '';
            const list = type === 'Expense' ? userConfig.expenseCats : userConfig.incomeCats;
            if(list) list.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c; opt.innerText = c; catSelect.appendChild(opt);
            });

            if(type === 'Expense') {
                btnExp.className = "flex-1 py-3 rounded-xl text-sm font-bold bg-white text-rose-600 shadow-sm transition-all";
                btnInc.className = "flex-1 py-3 rounded-xl text-sm font-bold text-slate-400 transition-all";
            } else {
                btnExp.className = "flex-1 py-3 rounded-xl text-sm font-bold text-slate-400 transition-all";
                btnInc.className = "flex-1 py-3 rounded-xl text-sm font-bold bg-white text-emerald-600 shadow-sm transition-all";
            }
        }
        
        window.renderSettingsCats = (tab) => {
            settingsTab = tab;
            const list = document.getElementById('settingsCatList');
            const btnExp = document.getElementById('setTabExp');
            const btnInc = document.getElementById('setTabInc');
            if(tab === 'Expense') {
                btnExp.className = "flex-1 py-2.5 rounded-lg text-sm font-bold bg-white text-rose-600 shadow-sm transition-all";
                btnInc.className = "flex-1 py-2.5 rounded-lg text-sm font-bold text-slate-400 transition-all";
            } else {
                btnExp.className = "flex-1 py-2.5 rounded-lg text-sm font-bold text-slate-400 transition-all";
                btnInc.className = "flex-1 py-2.5 rounded-lg text-sm font-bold bg-white text-emerald-600 shadow-sm transition-all";
            }
            list.innerHTML = '';
            const cats = tab === 'Expense' ? userConfig.expenseCats : userConfig.incomeCats;
            if(cats) cats.forEach(c => {
                const item = document.createElement('div');
                item.className = "flex justify-between items-center bg-white p-4 rounded-xl border border-slate-100";
                item.innerHTML = `
                    <span class="font-bold text-sm text-slate-700">${c}</span>
                    <button onclick="removeCat('${c}')" class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
                `;
                list.appendChild(item);
            });
        }

        window.addNewCategory = async () => {
            const input = document.getElementById('newCatName');
            const name = input.value.trim();
            if(!name) return;
            const ref = doc(db, "users", currentUser.uid, "settings", "config");
            let list = settingsTab === 'Expense' ? [...userConfig.expenseCats] : [...userConfig.incomeCats];
            if(!list.includes(name)) { list.push(name); await updateDoc(ref, settingsTab === 'Expense' ? { expenseCats: list } : { incomeCats: list }); }
            input.value = '';
        }

        window.removeCat = async (name) => {
            if(!confirm("Ștergi?")) return;
            const ref = doc(db, "users", currentUser.uid, "settings", "config");
            let list = settingsTab === 'Expense' ? [...userConfig.expenseCats] : [...userConfig.incomeCats];
            list = list.filter(c => c !== name);
            await updateDoc(ref, settingsTab === 'Expense' ? { expenseCats: list } : { incomeCats: list });
        }
        
        window.exportData = () => {
             const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(transactionsCache));
