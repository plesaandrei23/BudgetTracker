<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Budget Pro</title>

    <!-- External Libs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'media', // Uses system preference
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        /* No scroll on body, handled by main */
        body {
            overscroll-behavior-y: none;
        }

        /* Hidden utilities */
        .hidden {
            display: none !important;
        }

        /* Hide scrollbars but allow scrolling */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Remove spin buttons from inputs */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        /* Safe area padding for bottom nav */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</head>

<body
    class="fixed inset-0 w-full overflow-hidden flex flex-col bg-neutral-50 dark:bg-neutral-900 text-neutral-900 dark:text-neutral-100"
    style="color-scheme: light dark;">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen"
        class="fixed inset-0 z-[100] bg-neutral-50 dark:bg-neutral-900 flex flex-col items-center justify-center p-6 hidden">
        <div
            class="w-20 h-20 bg-amber-600 rounded-2xl flex items-center justify-center mb-6 shadow-lg shadow-amber-500/30">
            <i class="fa-solid fa-wallet text-4xl text-white"></i>
        </div>
        <h1 class="text-3xl font-bold mb-2">Budget Pro</h1>
        <p class="text-rev-sub mb-8">Financial Freedom</p>
        <button id="googleLoginBtn"
            class="bg-white text-neutral-900 px-8 py-3 rounded-full font-bold flex items-center gap-2 shadow-lg active:scale-95 transition">
            <i class="fa-brands fa-google text-red-500"></i> Login with Google
        </button>
    </div>

    <!-- HEADER (Fixed) -->
    <header id="appHeader"
        class="fixed top-0 left-0 right-0 z-50 bg-white/80 dark:bg-neutral-900/80 backdrop-blur border-b border-neutral-200 dark:border-neutral-800 px-6 pt-14 pb-4 hidden transition-all duration-300">
        <div class="flex justify-between items-center max-w-2xl mx-auto w-full">
            <h1 class="text-2xl font-black text-neutral-900 dark:text-white tracking-tight">Dashboard</h1>
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-600 to-amber-500 p-[2px]">
                <img id="userPhoto" src=""
                    class="w-full h-full rounded-full object-cover bg-neutral-200 dark:bg-neutral-800">
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main id="mainContainer"
        class="absolute inset-0 w-full pt-28 pb-24 max-w-2xl mx-auto overflow-y-auto overflow-x-hidden hidden animate-fade-in z-10">

        <!-- VIEW: HOME -->
        <section id="view-home" class="min-h-full">

            <!-- Account Cards -->
            <div class="p-4 overflow-x-auto scrollbar-hide flex gap-3 snap-x snap-mandatory" id="accountsList">
                <!-- JS Injected -->
            </div>

            <!-- Total Balance Display (if needed distinct from cards) -->
            <!-- We'll stick to Revolut style: Cards serve as balances -->

            <!-- Transaction List -->
            <div id="transactionList" class="px-4 space-y-1">
                <!-- Date Headers & Items Injected Here -->
            </div>

        </section>

        <section id="view-analytics" class="min-h-full p-4 hidden">
            <!-- Timeframe Navigation -->
            <div class="flex flex-col gap-4 mb-6">
                <!-- Mode Selection -->
                <div
                    class="bg-gray-200 dark:bg-neutral-800 p-1 rounded-xl flex text-xs font-bold text-neutral-500 dark:text-neutral-400">
                    <button onclick="changeAnalyticsMode('week')" id="btn-mode-week"
                        class="flex-1 py-2 rounded-lg bg-white dark:bg-neutral-700 text-neutral-900 dark:text-white shadow-md transition-all">Week</button>
                    <button onclick="changeAnalyticsMode('month')" id="btn-mode-month"
                        class="flex-1 py-2 rounded-lg hover:text-neutral-900 dark:hover:text-white transition-all">Month</button>
                    <button onclick="changeAnalyticsMode('year')" id="btn-mode-year"
                        class="flex-1 py-2 rounded-lg hover:text-neutral-900 dark:hover:text-white transition-all">Year</button>
                </div>

                <!-- Date Scroller -->
                <div
                    class="flex items-center justify-between bg-white dark:bg-neutral-800 px-4 py-3 rounded-2xl shadow-lg border border-neutral-200 dark:border-neutral-700">
                    <button onclick="changeAnalyticsDate(-1)"
                        class="w-8 h-8 rounded-full bg-neutral-100 dark:bg-neutral-700 flex items-center justify-center text-neutral-600 dark:text-neutral-300 hover:bg-neutral-200 dark:hover:bg-neutral-600 active:scale-95 transition">
                        <i class="fa-solid fa-chevron-left text-xs"></i>
                    </button>

                    <span id="analytics-date-label"
                        class="text-sm font-bold text-neutral-900 dark:text-white tracking-wide">Jan 15 - Jan
                        21</span>

                    <button onclick="changeAnalyticsDate(1)"
                        class="w-8 h-8 rounded-full bg-neutral-100 dark:bg-neutral-700 flex items-center justify-center text-neutral-600 dark:text-neutral-300 hover:bg-neutral-200 dark:hover:bg-neutral-600 active:scale-95 transition">
                        <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                </div>
            </div>

            <!-- Insights Container -->
            <div id="insightsContainer" class="space-y-6">
                <!-- Dynamic Content Will Be Injected Here via JS -->
            </div>

            <!-- Category Breakdown List (Generated via JS) -->
            <div id="analyticsBreakdown" class="space-y-4"></div>
        </section>

        <!-- VIEW: GOALS -->
        <section id="view-goals"
            class="min-h-full p-4 hidden flex flex-col items-center justify-center text-center space-y-6">
            <div
                class="w-20 h-20 rounded-full bg-gray-100 dark:bg-neutral-800 flex items-center justify-center mb-2 shadow-lg shadow-purple-500/20">
                <i class="fa-solid fa-bullseye text-3xl text-purple-500"></i>
            </div>

            <div>
                <h2 class="text-2xl font-bold text-neutral-900 dark:text-white mb-2">Goals & Allocation</h2>
                <div
                    class="inline-block bg-gray-100 dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 px-3 py-1 rounded-full text-xs font-bold text-neutral-500 dark:text-neutral-400 uppercase tracking-widest">
                    Coming Soon
                </div>
            </div>

            <div
                class="bg-gray-50/50 dark:bg-neutral-800/50 p-6 rounded-2xl border border-dashed border-gray-300 dark:border-neutral-700 max-w-xs mx-auto">
                <p class="text-sm text-neutral-600 dark:text-neutral-300 italic leading-relaxed">
                    "Optiunea de a seta goals si a aloca bani pentru ele. Sa apara frumos cu piechart, cat % sunt
                    finalizate si cand sunt gata."
                </p>
            </div>
        </section>

        <!-- VIEW: SETTINGS -->
        <section id="view-settings" class="min-h-full p-4 hidden">
            <!-- User Info -->
            <div
                class="flex items-center gap-4 mb-8 p-4 bg-white dark:bg-neutral-800 rounded-2xl border border-neutral-200 dark:border-neutral-700">
                <img id="userPhoto" src="" class="w-12 h-12 rounded-full">
                <div>
                    <h2 id="userName" class="font-bold text-lg text-neutral-900 dark:text-white">User</h2>
                    <p id="userEmail" class="text-xs text-neutral-500 dark:text-neutral-400">email@example.com</p>
                </div>
            </div>

            <!-- Actions -->
            <div class="space-y-3">
                <div
                    class="bg-white dark:bg-neutral-800 rounded-2xl overflow-hidden border border-neutral-200 dark:border-neutral-700">
                    <button onclick="triggerImport()"
                        class="w-full flex items-center justify-between p-4 hover:bg-neutral-50 dark:hover:bg-white/5 transition border-b border-neutral-200 dark:border-neutral-700">
                        <span class="flex items-center gap-3 font-bold text-neutral-800 dark:text-neutral-200"><i
                                class="fa-solid fa-file-import text-amber-500"></i>
                            Import JSON</span>
                        <i class="fa-solid fa-chevron-right text-xs text-neutral-400"></i>
                    </button>
                    <button onclick="exportData()"
                        class="w-full flex items-center justify-between p-4 hover:bg-neutral-50 dark:hover:bg-white/5 transition">
                        <span class="flex items-center gap-3 font-bold text-neutral-800 dark:text-neutral-200"><i
                                class="fa-solid fa-download text-emerald-500"></i>
                            Export JSON</span>
                        <i class="fa-solid fa-chevron-right text-xs text-neutral-400"></i>
                    </button>
                </div>

                <div
                    class="bg-white dark:bg-neutral-800 rounded-2xl overflow-hidden border border-neutral-200 dark:border-neutral-700">
                    <button id="logoutBtn"
                        class="w-full flex items-center justify-between p-4 hover:bg-red-500/10 transition text-red-500 font-bold">
                        <span class="flex items-center gap-3"><i class="fa-solid fa-right-from-bracket"></i> Log
                            Out</span>
                    </button>
                </div>
            </div>

            <!-- Hidden Import Input -->
            <input type="file" id="importFile" accept=".json" class="hidden" onchange="handleImportFile(this)">
        </section>

    </main>

    <!-- BOTTOM NAV (Fixed) -->
    <nav id="bottomNav"
        class="fixed bottom-0 left-0 right-0 h-[calc(4rem+env(safe-area-inset-bottom))] pb-safe bg-white/95 dark:bg-neutral-900/95 backdrop-blur border-t border-neutral-200 dark:border-neutral-800 flex items-center justify-around z-50 hidden">
        <!-- 1. HOME -->
        <button onclick="navigateTo('home')" class="nav-btn flex flex-col items-center gap-1 text-amber-500 w-16"
            data-target="home">
            <i class="fa-solid fa-house text-xl"></i>
            <span class="text-[10px] font-medium">Home</span>
        </button>

        <!-- 2. GOALS -->
        <button onclick="navigateTo('goals')"
            class="nav-btn flex flex-col items-center gap-1 text-neutral-400 dark:text-neutral-500 w-16"
            data-target="goals">
            <i class="fa-solid fa-bullseye text-xl"></i>
            <span class="text-[10px] font-medium">Goals</span>
        </button>

        <!-- 3. ADD (Center) -->
        <button onclick="openAddModal()"
            class="bg-amber-500 w-12 h-12 rounded-full flex items-center justify-center -mt-6 shadow-lg shadow-amber-500/40 text-black active:scale-95 transition">
            <i class="fa-solid fa-plus text-xl"></i>
        </button>

        <!-- 4. ANALYTICS -->
        <button onclick="navigateTo('analytics')"
            class="nav-btn flex flex-col items-center gap-1 text-neutral-400 dark:text-neutral-500 w-16"
            data-target="analytics">
            <i class="fa-solid fa-chart-pie text-xl"></i>
            <span class="text-[10px] font-medium">Analytics</span>
        </button>

        <!-- 5. SETTINGS -->
        <button onclick="navigateTo('settings')"
            class="nav-btn flex flex-col items-center gap-1 text-neutral-400 dark:text-neutral-500 w-16"
            data-target="settings">
            <i class="fa-solid fa-gear text-xl"></i>
            <span class="text-[10px] font-medium">Settings</span>
        </button>
    </nav>

    <!-- MODAL: ADD TRANSACTION -->
    <div id="addModal" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeAddModal()"></div>
        <div
            class="absolute bottom-0 w-full bg-white dark:bg-neutral-800 rounded-t-3xl p-6 pb-12 animate-slide-up max-h-[90vh] overflow-y-auto">

            <!-- Dragger -->
            <div class="w-12 h-1.5 bg-neutral-300 dark:bg-neutral-700 rounded-full mx-auto mb-6"></div>

            <div class="flex gap-2 bg-neutral-100 dark:bg-neutral-900 p-1 rounded-xl mb-6">
                <button onclick="setType('Expense')" id="btnEp"
                    class="flex-1 py-2 rounded-lg text-sm font-bold bg-white dark:bg-neutral-800 shadow text-neutral-900 dark:text-white">Expense</button>
                <button onclick="setType('Income')" id="btnIn"
                    class="flex-1 py-2 rounded-lg text-sm font-bold text-neutral-500 dark:text-neutral-400">Income</button>
                <button onclick="setType('Transfer')" id="btnTr"
                    class="flex-1 py-2 rounded-lg text-sm font-bold text-neutral-500 dark:text-neutral-400">Transfer</button>
            </div>

            <div class="space-y-4">
                <!-- Amount -->
                <div class="relative">
                    <input type="number" id="inpAmount" placeholder="0"
                        class="w-full bg-transparent text-center text-4xl font-bold border-b border-neutral-200 dark:border-neutral-700 pb-2 focus:border-amber-500 outline-none text-neutral-900 dark:text-white">
                    <span
                        class="absolute right-4 top-2 text-sm font-bold text-neutral-400 dark:text-neutral-500">RON</span>
                </div>

                <!-- From Account -->
                <div>
                    <label class="text-xs uppercase font-bold text-neutral-500 ml-1">From Account</label>
                    <select id="inpAccount"
                        class="w-full bg-neutral-100 dark:bg-neutral-900 p-3 rounded-xl mt-1 outline-none border border-transparent focus:border-amber-500 text-neutral-900 dark:text-white appearance-none"></select>
                </div>

                <!-- To Account (Transfer only) -->
                <div id="fieldToAccount" class="hidden">
                    <label class="text-xs uppercase font-bold text-neutral-500 ml-1">To Account</label>
                    <select id="inpToAccount"
                        class="w-full bg-neutral-100 dark:bg-neutral-900 p-3 rounded-xl mt-1 outline-none text-neutral-900 dark:text-white appearance-none"></select>
                </div>

                <!-- Category (Exp/Inc only) -->
                <div id="fieldCategory">
                    <label class="text-xs uppercase font-bold text-neutral-500 ml-1">Category</label>
                    <div id="catList" class="flex gap-2 overflow-x-auto py-2"></div>
                    <input type="hidden" id="inpCategory">
                </div>

                <!-- Description -->
                <div>
                    <label class="text-xs uppercase font-bold text-neutral-500 ml-1">Description</label>
                    <input type="text" id="inpDesc"
                        class="w-full bg-neutral-100 dark:bg-neutral-900 p-3 rounded-xl mt-1 outline-none text-neutral-900 dark:text-white"
                        placeholder="What is this for?">
                </div>

                <!-- Date -->
                <div>
                    <label class="text-xs uppercase font-bold text-neutral-500 ml-1">Date</label>
                    <input type="date" id="inpDate"
                        class="w-full bg-neutral-100 dark:bg-neutral-900 p-3 rounded-xl mt-1 outline-none text-neutral-900 dark:text-white">
                </div>

                <!-- TIP (PFA Business only) -->
                <div id="fieldTip" class="hidden">
                    <label class="text-xs uppercase font-bold text-emerald-500 ml-1">Tip Amount (Bacșiș)</label>
                    <input type="number" id="inpTip" placeholder="0.00"
                        class="w-full bg-neutral-100 dark:bg-neutral-900 p-3 rounded-xl mt-1 outline-none border border-emerald-500/50 text-emerald-600 dark:text-emerald-400">
                </div>

                <button id="saveTxBtn" onclick="saveTransaction()"
                    class="w-full bg-amber-500 py-4 rounded-xl font-bold text-black mt-4 shadow-lg active:scale-95 transition">
                    Save Transaction
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
