<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Budget Pro</title>

    <!-- External Libs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rev: {
                            bg: '#0f172a',      /* Slate 900 */
                            card: '#1e293b',    /* Slate 800 */
                            accent: '#3b82f6',  /* Blue 500 */
                            text: '#f1f5f9',    /* Slate 100 */
                            sub: '#94a3b8'      /* Slate 400 */
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        /* No scroll on body, handled by main */
        body {
            overscroll-behavior-y: none;
        }

        /* Hidden utilities */
        .hidden {
            display: none !important;
        }

        /* Hide scrollbars but allow scrolling */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Remove spin buttons from inputs */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Safe area padding for bottom nav */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</head>

<body class="h-screen w-screen overflow-hidden flex flex-col bg-rev-bg text-rev-text">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="fixed inset-0 z-[100] bg-rev-bg flex flex-col items-center justify-center p-6 hidden">
        <div
            class="w-20 h-20 bg-blue-600 rounded-2xl flex items-center justify-center mb-6 shadow-lg shadow-blue-500/30">
            <i class="fa-solid fa-wallet text-4xl text-white"></i>
        </div>
        <h1 class="text-3xl font-bold mb-2">Budget Pro</h1>
        <p class="text-rev-sub mb-8">Financial Freedom</p>
        <button id="googleLoginBtn"
            class="bg-white text-slate-900 px-8 py-3 rounded-full font-bold flex items-center gap-2 shadow-lg active:scale-95 transition">
            <i class="fa-brands fa-google text-red-500"></i> Login with Google
        </button>
    </div>

    <!-- APP HEADER (Fixed) -->
    <header id="appHeader"
        class="h-16 flex items-center justify-between px-4 border-b border-white/5 bg-rev-bg/95 backdrop-blur z-50 hidden">
        <!-- Dynamic Header Content -->
        <div id="headerTitle" class="font-bold text-lg">Dashboard</div>
        <div id="headerActions">
            <!-- Injected by JS -->
        </div>
    </header>

    <!-- MAIN CONTENT (Scrollable) -->
    <main id="mainContainer" class="flex-1 overflow-y-auto relative hidden">

        <!-- VIEW: HOME -->
        <section id="view-home" class="min-h-full pb-24">

            <!-- Account Cards -->
            <div class="p-4 overflow-x-auto scrollbar-hide flex gap-3 snap-x snap-mandatory" id="accountsList">
                <!-- JS Injected -->
            </div>

            <!-- Total Balance Display (if needed distinct from cards) -->
            <!-- We'll stick to Revolut style: Cards serve as balances -->

            <!-- Transaction List -->
            <div id="transactionList" class="px-4 space-y-1">
                <!-- Date Headers & Items Injected Here -->
            </div>

        </section>

        <section id="view-analytics" class="min-h-full p-4 pb-24 hidden">
            <!-- Timeframe Navigation -->
            <div class="flex flex-col gap-4 mb-6">
                <!-- Mode Selection -->
                <div class="bg-neutral-800 p-1 rounded-xl flex text-xs font-bold text-neutral-400">
                    <button onclick="changeAnalyticsMode('week')" id="btn-mode-week"
                        class="flex-1 py-2 rounded-lg bg-neutral-700 text-white shadow-md transition-all">Week</button>
                    <button onclick="changeAnalyticsMode('month')" id="btn-mode-month"
                        class="flex-1 py-2 rounded-lg hover:text-white transition-all">Month</button>
                    <button onclick="changeAnalyticsMode('year')" id="btn-mode-year"
                        class="flex-1 py-2 rounded-lg hover:text-white transition-all">Year</button>
                </div>

                <!-- Date Scroller -->
                <div
                    class="flex items-center justify-between bg-neutral-800 px-4 py-3 rounded-2xl shadow-lg border border-neutral-700">
                    <button onclick="changeAnalyticsDate(-1)"
                        class="w-8 h-8 rounded-full bg-neutral-700 flex items-center justify-center text-neutral-300 hover:bg-neutral-600 active:scale-95 transition">
                        <i class="fa-solid fa-chevron-left text-xs"></i>
                    </button>

                    <span id="analytics-date-label" class="text-sm font-bold text-white tracking-wide">Jan 15 - Jan
                        21</span>

                    <button onclick="changeAnalyticsDate(1)"
                        class="w-8 h-8 rounded-full bg-neutral-700 flex items-center justify-center text-neutral-300 hover:bg-neutral-600 active:scale-95 transition">
                        <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                </div>
            </div>

            <!-- Insights Container -->
            <div id="insightsContainer" class="space-y-6">
                <!-- Dynamic Content Will Be Injected Here via JS -->
            </div>

            <!-- Category Breakdown List (Generated via JS) -->
            <div id="analyticsBreakdown" class="space-y-4 pb-24"></div>
        </section>

        <!-- VIEW: GOALS -->
        <section id="view-goals"
            class="min-h-full p-4 pb-24 hidden flex flex-col items-center justify-center text-center space-y-6">
            <div
                class="w-20 h-20 rounded-full bg-neutral-800 flex items-center justify-center mb-2 shadow-lg shadow-purple-500/20">
                <i class="fa-solid fa-bullseye text-3xl text-purple-500"></i>
            </div>

            <div>
                <h2 class="text-2xl font-bold text-white mb-2">Goals & Allocation</h2>
                <div
                    class="inline-block bg-neutral-800 border border-neutral-700 px-3 py-1 rounded-full text-xs font-bold text-neutral-400 uppercase tracking-widest">
                    Coming Soon
                </div>
            </div>

            <div class="bg-neutral-800/50 p-6 rounded-2xl border border-dashed border-neutral-700 max-w-xs mx-auto">
                <p class="text-sm text-neutral-300 italic leading-relaxed">
                    "Optiunea de a seta goals si a aloca bani pentru ele. Sa apara frumos cu piechart, cat % sunt
                    finalizate si cand sunt gata."
                </p>
            </div>
        </section>

        <!-- VIEW: SETTINGS -->
        <section id="view-settings" class="min-h-full p-4 pb-24 hidden">
            <!-- User Info -->
            <div class="flex items-center gap-4 mb-8 p-4 bg-rev-card rounded-2xl border border-white/5">
                <img id="userPhoto" src="" class="w-12 h-12 rounded-full">
                <div>
                    <h2 id="userName" class="font-bold text-lg">User</h2>
                    <p id="userEmail" class="text-xs text-rev-sub">email@example.com</p>
                </div>
            </div>

            <!-- Actions -->
            <div class="space-y-3">
                <div class="bg-rev-card rounded-2xl overflow-hidden border border-white/5">
                    <button onclick="triggerImport()"
                        class="w-full flex items-center justify-between p-4 hover:bg-white/5 transition border-b border-white/5">
                        <span class="flex items-center gap-3"><i class="fa-solid fa-file-import text-blue-400"></i>
                            Import JSON</span>
                        <i class="fa-solid fa-chevron-right text-xs text-rev-sub"></i>
                    </button>
                    <button onclick="exportData()"
                        class="w-full flex items-center justify-between p-4 hover:bg-white/5 transition">
                        <span class="flex items-center gap-3"><i class="fa-solid fa-download text-emerald-400"></i>
                            Export JSON</span>
                        <i class="fa-solid fa-chevron-right text-xs text-rev-sub"></i>
                    </button>
                </div>

                <div class="bg-rev-card rounded-2xl overflow-hidden border border-white/5">
                    <button id="logoutBtn"
                        class="w-full flex items-center justify-between p-4 hover:bg-red-500/10 transition text-red-500">
                        <span class="flex items-center gap-3"><i class="fa-solid fa-right-from-bracket"></i> Log
                            Out</span>
                    </button>
                </div>
            </div>

            <!-- Hidden Import Input -->
            <input type="file" id="importFile" accept=".json" class="hidden" onchange="handleImportFile(this)">
        </section>

    </main>

    <!-- BOTTOM NAV (Fixed) -->
    <nav id="bottomNav"
        class="h-[calc(4rem+env(safe-area-inset-bottom))] pb-safe bg-rev-bg/95 backdrop-blur border-t border-white/5 flex items-center justify-around z-50 hidden">
        <!-- 1. HOME -->
        <button onclick="navigateTo('home')" class="nav-btn flex flex-col items-center gap-1 text-blue-500 w-16"
            data-target="home">
            <i class="fa-solid fa-house text-xl"></i>
            <span class="text-[10px] font-medium">Home</span>
        </button>

        <!-- 2. GOALS -->
        <button onclick="navigateTo('goals')" class="nav-btn flex flex-col items-center gap-1 text-rev-sub w-16"
            data-target="goals">
            <i class="fa-solid fa-bullseye text-xl"></i>
            <span class="text-[10px] font-medium">Goals</span>
        </button>

        <!-- 3. ADD (Center) -->
        <button onclick="openAddModal()"
            class="bg-blue-600 w-12 h-12 rounded-full flex items-center justify-center -mt-6 shadow-lg shadow-blue-500/40 text-white active:scale-95 transition">
            <i class="fa-solid fa-plus text-xl"></i>
        </button>

        <!-- 4. ANALYTICS -->
        <button onclick="navigateTo('analytics')" class="nav-btn flex flex-col items-center gap-1 text-rev-sub w-16"
            data-target="analytics">
            <i class="fa-solid fa-chart-pie text-xl"></i>
            <span class="text-[10px] font-medium">Analytics</span>
        </button>

        <!-- 5. SETTINGS -->
        <button onclick="navigateTo('settings')" class="nav-btn flex flex-col items-center gap-1 text-rev-sub w-16"
            data-target="settings">
            <i class="fa-solid fa-gear text-xl"></i>
            <span class="text-[10px] font-medium">Settings</span>
        </button>
    </nav>

    <!-- MODAL: ADD TRANSACTION -->
    <div id="addModal" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="closeAddModal()"></div>
        <div
            class="absolute bottom-0 w-full bg-rev-card rounded-t-3xl p-6 pb-12 animate-slide-up max-h-[90vh] overflow-y-auto">

            <!-- Dragger -->
            <div class="w-12 h-1.5 bg-slate-700 rounded-full mx-auto mb-6"></div>

            <div class="flex gap-2 bg-slate-800 p-1 rounded-xl mb-6">
                <button onclick="setType('Expense')" id="btnEp"
                    class="flex-1 py-2 rounded-lg text-sm font-bold bg-rev-card shadow text-white">Expense</button>
                <button onclick="setType('Income')" id="btnIn"
                    class="flex-1 py-2 rounded-lg text-sm font-bold text-slate-400">Income</button>
                <button onclick="setType('Transfer')" id="btnTr"
                    class="flex-1 py-2 rounded-lg text-sm font-bold text-slate-400">Transfer</button>
            </div>

            <div class="space-y-4">
                <!-- Amount -->
                <div class="relative">
                    <input type="number" id="inpAmount" placeholder="0"
                        class="w-full bg-transparent text-center text-4xl font-bold border-b border-slate-700 pb-2 focus:border-blue-500 outline-none text-white">
                    <span class="absolute right-4 top-2 text-sm font-bold text-slate-500">RON</span>
                </div>

                <!-- From Account -->
                <div>
                    <label class="text-xs uppercase font-bold text-slate-500 ml-1">From Account</label>
                    <select id="inpAccount"
                        class="w-full bg-slate-800 p-3 rounded-xl mt-1 outline-none border border-transparent focus:border-blue-500 text-white appearance-none"></select>
                </div>

                <!-- To Account (Transfer only) -->
                <div id="fieldToAccount" class="hidden">
                    <label class="text-xs uppercase font-bold text-slate-500 ml-1">To Account</label>
                    <select id="inpToAccount"
                        class="w-full bg-slate-800 p-3 rounded-xl mt-1 outline-none text-white appearance-none"></select>
                </div>

                <!-- Category (Exp/Inc only) -->
                <div id="fieldCategory">
                    <label class="text-xs uppercase font-bold text-slate-500 ml-1">Category</label>
                    <div id="catList" class="flex gap-2 overflow-x-auto py-2"></div>
                    <input type="hidden" id="inpCategory">
                </div>

                <!-- Description -->
                <div>
                    <label class="text-xs uppercase font-bold text-slate-500 ml-1">Description</label>
                    <input type="text" id="inpDesc"
                        class="w-full bg-slate-800 p-3 rounded-xl mt-1 outline-none text-white"
                        placeholder="What is this for?">
                </div>

                <!-- Date -->
                <div>
                    <label class="text-xs uppercase font-bold text-slate-500 ml-1">Date</label>
                    <input type="date" id="inpDate"
                        class="w-full bg-slate-800 p-3 rounded-xl mt-1 outline-none text-white">
                </div>

                <!-- TIP (PFA Business only) -->
                <div id="fieldTip" class="hidden">
                    <label class="text-xs uppercase font-bold text-emerald-500 ml-1">Tip Amount (Bacșiș)</label>
                    <input type="number" id="inpTip" placeholder="0.00"
                        class="w-full bg-slate-800 p-3 rounded-xl mt-1 outline-none border border-emerald-500/50 text-emerald-400">
                </div>

                <button onclick="saveTransaction()"
                    class="w-full bg-blue-600 py-4 rounded-xl font-bold text-white mt-4 shadow-lg active:scale-95 transition">
                    Save Transaction
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
