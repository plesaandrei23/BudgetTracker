<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <title>Budget Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            overscroll-behavior-y: none;
        }

        .hidden {
            display: none !important;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>

<body class="text-slate-800 h-screen flex flex-col">

    <div id="loginScreen"
        class="fixed inset-0 bg-slate-900 z-[100] flex flex-col items-center justify-center text-white p-6 hidden">
        <div
            class="w-24 h-24 bg-blue-600 rounded-3xl flex items-center justify-center mb-8 shadow-2xl shadow-blue-500/20">
            <i class="fa-solid fa-wallet text-5xl"></i>
        </div>
        <h1 class="text-4xl font-bold mb-3 tracking-tight">Budget Pro</h1>
        <p class="text-slate-400 mb-12 text-center">Gestionează-ți banii inteligent.</p>
        <button id="googleLoginBtn"
            class="bg-white text-slate-900 px-8 py-4 rounded-xl font-bold flex items-center gap-3 hover:bg-slate-100 active:scale-95 transition shadow-xl w-full max-w-sm justify-center">
            <i class="fa-brands fa-google text-red-500 text-xl"></i> Autentificare Google
        </button>
    </div>

    <header id="appHeader"
        class="bg-slate-900 text-white pt-[max(15px,env(safe-area-inset-top))] pb-6 px-6 shadow-xl relative z-10 hidden shrink-0">
        <div class="max-w-5xl mx-auto w-full">
            <div class="flex justify-between items-center mb-6 mt-2">
                <div class="flex items-center gap-3">
                    <img id="userPhoto" src="" class="w-10 h-10 rounded-full border-2 border-slate-700 bg-slate-800">
                    <div>
                        <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Salut,</p>
                        <p id="userName" class="text-sm font-bold leading-none">User</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="exportData()"
                        class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 flex items-center justify-center transition backdrop-blur-md">
                        <i class="fa-solid fa-cloud-arrow-down"></i>
                    </button>
                    <button onclick="toggleSettings()"
                        class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 flex items-center justify-center transition backdrop-blur-md">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 items-end">
                <div class="col-span-2">
                    <p class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Balanță</p>
                    <p class="text-4xl font-extrabold tracking-tight" id="balance">0.00 Lei</p>
                </div>
                <div
                    class="bg-emerald-500/10 border border-emerald-500/20 rounded-xl p-3 flex items-center justify-between">
                    <div>
                        <p class="text-[10px] text-emerald-400 font-bold uppercase">Venit</p>
                        <p class="font-bold text-emerald-400 text-lg" id="totalIncome">0</p>
                    </div>
                    <i class="fa-solid fa-arrow-down text-emerald-500/50 text-xl"></i>
                </div>
                <div class="bg-rose-500/10 border border-rose-500/20 rounded-xl p-3 flex items-center justify-between">
                    <div>
                        <p class="text-[10px] text-rose-400 font-bold uppercase">Cheltuieli</p>
                        <p class="font-bold text-rose-400 text-lg" id="totalExpense">0</p>
                    </div>
                    <i class="fa-solid fa-arrow-up text-rose-500/50 text-xl"></i>
                </div>
            </div>
        </div>
    </header>

    <main id="mainContent" class="flex-1 overflow-y-auto bg-slate-50 hidden relative">
        <div class="max-w-5xl mx-auto w-full p-4 md:p-8 md:grid md:grid-cols-12 md:gap-8">

            <div class="md:col-span-5 space-y-6">

                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 relative">
                    <h3 class="text-sm font-bold text-slate-700 mb-4">Analiză Cheltuieli</h3>

                    <div class="relative h-48 w-full flex justify-center items-center">
                        <canvas id="expenseChart" class="z-10 relative"></canvas>

                        <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none z-0">
                            <p class="text-xs text-slate-400 font-bold uppercase">Total</p>
                            <p class="text-xl font-bold text-slate-800" id="chartTotal">0</p>
                        </div>
                    </div>
                </div>

                <div id="formCard" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 sticky top-4">
                    <div id="editHeader"
                        class="flex justify-between items-center mb-4 hidden bg-blue-50 p-2.5 rounded-xl border border-blue-100">
                        <span class="text-xs font-bold text-blue-600 uppercase flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span> Modifici Tranzacție
                        </span>
                        <button onclick="cancelEdit()"
                            class="w-6 h-6 rounded-full bg-white text-slate-400 hover:text-red-500 flex items-center justify-center shadow-sm"><i
                                class="fa-solid fa-xmark text-xs"></i></button>
                    </div>

                    <div class="flex bg-slate-100 p-1.5 rounded-xl mb-4">
                        <button id="btnExpense" onclick="setType('Expense')"
                            class="flex-1 py-2.5 rounded-lg text-sm font-bold bg-white text-rose-600 shadow-sm transition-all">Cheltuială</button>
                        <button id="btnIncome" onclick="setType('Income')"
                            class="flex-1 py-2.5 rounded-lg text-sm font-bold text-slate-400 transition-all">Venit</button>
                    </div>

                    <div class="flex bg-slate-100 p-1.5 rounded-xl mb-4">
                        <button id="btnCash" onclick="togglePaymentMethod('Cash')"
                            class="flex-1 py-2.5 rounded-lg text-sm font-bold bg-white text-slate-800 shadow-sm transition-all">Cash</button>
                        <button id="btnCard" onclick="togglePaymentMethod('Card')"
                            class="flex-1 py-2.5 rounded-lg text-sm font-bold text-slate-400 transition-all">Card</button>
                    </div>

                    <div class="space-y-3">
                        <div class="grid grid-cols-2 gap-3">
                            <input type="date" id="dateInput"
                                class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-600 outline-none focus:ring-2 focus:ring-blue-500">
                            <input type="number" id="amount" placeholder="Sumă"
                                class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <select id="category"
                            class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium outline-none focus:ring-2 focus:ring-blue-500"></select>
                        <select id="cardSelect"
                            class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium outline-none focus:ring-2 focus:ring-blue-500 hidden"></select>
                        <input type="text" id="description" placeholder="Descriere (opțional)"
                            class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
                        <button id="saveBtn"
                            class="w-full bg-slate-900 text-white py-3.5 rounded-xl font-bold shadow-lg hover:bg-slate-800 active:scale-[0.98] transition-transform flex items-center justify-center gap-2 mt-2">Salvează</button>
                    </div>
                </div>
            </div>

            <div class="md:col-span-7 mt-6 md:mt-0">
                <div class="flex justify-between items-center mb-4 px-1">
                    <h2 class="text-slate-800 font-bold text-lg">Tranzacții</h2>
                    <div
                        class="text-[10px] font-bold bg-emerald-100 text-emerald-600 px-2.5 py-1 rounded-full flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Sync
                    </div>
                </div>
                <div id="transactionList" class="space-y-3 pb-24 md:pb-0">
                    <div class="p-10 text-center text-slate-400 text-sm">Se încarcă...</div>
                </div>
            </div>
        </div>
    </main>

    <div id="settingsOverlay"
        class="fixed inset-0 z-40 bg-slate-900/60 backdrop-blur-sm hidden flex items-end md:items-center justify-center"
        onclick="toggleSettings()">
        <div id="settingsPanel"
            class="w-full h-[85vh] md:h-auto md:max-w-md bg-white rounded-t-[2rem] md:rounded-2xl shadow-2xl flex flex-col hidden"
            onclick="event.stopPropagation()">
            <div class="w-full flex justify-center pt-4 pb-2 md:hidden" onclick="toggleSettings()">
                <div class="w-12 h-1.5 bg-slate-200 rounded-full"></div>
            </div>
            <div class="hidden md:flex justify-between items-center p-6 pb-0">
                <h3 class="font-bold text-xl text-slate-800">Setări</h3>
                <button onclick="toggleSettings()"
                    class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center hover:bg-slate-200 transition"><i
                        class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto p-6">
                <h3 class="font-bold text-lg mb-4 text-slate-800 md:hidden">Setări Categorii</h3>
                <div class="flex bg-slate-100 p-1 rounded-xl mb-4">
                    <button onclick="renderSettingsCats('Expense')" id="setTabExp"
                        class="flex-1 py-2.5 rounded-lg text-sm font-bold bg-white text-rose-600 shadow-sm transition-all">Cheltuieli</button>
                    <button onclick="renderSettingsCats('Income')" id="setTabInc"
                        class="flex-1 py-2.5 rounded-lg text-sm font-bold text-slate-400 transition-all">Venituri</button>
                    <button onclick="renderSettingsCats('Cards')" id="setTabCards"
                        class="flex-1 py-2.5 rounded-lg text-sm font-bold text-slate-400 transition-all">Carduri</button>
                </div>
                <div class="flex gap-2 mb-4">
                    <input type="text" id="newCatName" placeholder="Nume categorie..."
                        class="flex-1 h-12 px-4 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium">
                    <button onclick="addNewCategory()"
                        class="bg-blue-600 text-white w-12 h-12 rounded-xl flex items-center justify-center text-lg hover:bg-blue-700 transition"><i
                            class="fa-solid fa-plus"></i></button>
                </div>
                <div id="settingsCatList" class="space-y-2 max-h-[300px] overflow-y-auto pr-1"></div>
                <div class="mt-8 pt-4 border-t border-slate-100">
                    <button id="logoutBtn"
                        class="w-full text-rose-500 bg-rose-50 hover:bg-rose-100 py-3.5 rounded-xl font-bold text-sm border border-rose-100 transition">Ieșire
                        din cont</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
